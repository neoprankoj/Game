packages:
  - apps/*
  - packages/*
  - tools/*

# One exact version per tool across all workspaces (ADR-0001/0002). Upgrade here, deliberately.
catalog:
  '@eslint/js': 10.0.1
  '@fastify/cors': 11.3.1
  '@fastify/helmet': 13.2.0
  '@fastify/rate-limit': 11.2.1
  '@types/node': 24.19.2
  '@types/pg': 8.23.1
  better-auth: 1.7.15
  '@better-auth/expo': 1.7.15
  bullmq: 6.5.3
  dependency-cruiser: 18.7.0
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  esbuild: 0.28.2
  eslint: 10.14.0
  eslint-config-prettier: 10.1.8
  fastify: 5.12.7
  globals: 17.13.0
  ioredis: 5.11.1
  pg: 8.23.1
  pino: 10.4.0
  pino-pretty: 13.2.0
  prettier: 3.9.10
  tsx: 4.23.15
  turbo: 2.11.10
  typescript: 6.0.3
  typescript-eslint: 8.72.1
  vite: 8.3.5
  vitest: 5.0.5
  zod: 4.6.7

# Fail fast on the wrong Node major instead of producing subtly different installs.
engineStrict: true

# Dependency install scripts are blocked by default (supply-chain hygiene, RISKS R-31). Allow-list only what
# is needed, each with a reason: esbuild installs its platform binary (used by drizzle-kit, tsx and the app bundler).
allowBuilds:
  esbuild: true
  # Optional native speed-up for msgpackr (via bullmq). Its prebuilt binaries ship as optional packages and
  # msgpackr falls back to JavaScript, so the install script is not needed: denied explicitly (Part 2.6).
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.18'
  - '@expo/config@58.0.10'
  - '@expo/fingerprint@0.21.8'
  - '@expo/local-build-cache-provider@58.0.10'
  - '@expo/log-box@58.0.14'
  - '@expo/metro-config@58.0.20'
  - '@expo/metro-runtime@58.0.16'
  - '@expo/prebuild-config@58.0.18'
  - '@expo/router-server@58.0.20'
  - '@expo/schema-utils@58.0.3'
  - babel-preset-expo@58.0.23
  - expo-modules-core@58.0.29
  - expo-router@58.0.29
  - expo@58.0.22
