# Local development dependencies ONLY (CLAUDE.md §5: managed hosting in production, ADR-0009).
# Start/stop through `pnpm dev:up | dev:down | dev:reset | dev:status` (infrastructure/scripts/dev.mjs).
# Images are pinned to the versions verified for this project; upgrade deliberately (ADR-0006, ADR-0008).
name: chronos

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:?set POSTGRES_TEST_DB in .env}
      TZ: UTC
      PGTZ: UTC
    # Game time is UTC everywhere (rule 5). Statement logging of slow queries helps spot missing indexes early.
    command: ['postgres', '-c', 'timezone=UTC', '-c', 'log_min_duration_statement=250']
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432' # loopback only: never expose the dev DB on the network
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.3
    restart: unless-stopped
    # ADR-0008: BullMQ requires noeviction; AOF persistence avoids reconciler bursts after restarts;
    # a password keeps parity with production (Redis is never exposed without auth).
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'yes'
    ports:
      - '127.0.0.1:${REDIS_PORT:-56379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  postgres-data:
  redis-data:
