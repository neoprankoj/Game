packages:
  - apps/*
  - packages/*
  - tools/*

# One exact version per tool across all workspaces (ADR-0001/0002). Upgrade here, deliberately.
catalog:
  '@eslint/js': 10.0.1
  '@fastify/cors': 11.3.1
  '@fastify/helmet': 13.2.0
  '@fastify/rate-limit': 11.2.1
  '@types/node': 24.19.2
  '@types/pg': 8.23.1
  dependency-cruiser: 18.7.0
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  esbuild: 0.28.2
  eslint: 10.14.0
  eslint-config-prettier: 10.1.8
  fastify: 5.12.7
  globals: 17.13.0
  ioredis: 5.11.1
  pg: 8.23.1
  pino-pretty: 13.2.0
  prettier: 3.9.10
  tsx: 4.23.15
  turbo: 2.11.10
  typescript: 6.0.3
  typescript-eslint: 8.72.1
  vite: 8.3.5
  vitest: 5.0.5
  zod: 4.6.7

# Fail fast on the wrong Node major instead of producing subtly different installs.
engineStrict: true

# Dependency install scripts are blocked by default (supply-chain hygiene, RISKS R-31). Allow-list only what
# is needed, each with a reason: esbuild installs its platform binary (used by drizzle-kit and tsx).
allowBuilds:
  esbuild: true
